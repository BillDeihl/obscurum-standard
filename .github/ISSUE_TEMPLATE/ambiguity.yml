name: Ambiguity or gap
description: The text is unclear, underspecified, or silent on something
labels: ["clarity", "needs-triage"]
body:
  - type: input
    id: section
    attributes:
      label: Section
    validations:
      required: true

  - type: textarea
    id: reading
    attributes:
      label: The two readings
      description: |
        What does the text let a reader conclude, and what is the other
        conclusion a different reader could reach? If the text is simply
        silent, say what question it leaves unanswered.
    validations:
      required: true

  - type: textarea
    id: consequence
    attributes:
      label: Why it matters
      description: |
        What would two implementers do differently? A difference that
        changes a score matters more than one that does not.
    validations:
      required: true
